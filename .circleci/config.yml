version: 2.1

parameters:
  GHA_Actor:
    type: string
    default: ""
  GHA_Action:
    type: string
    default: ""
  GHA_Event:
    type: string
    default: ""
  GHA_Meta:
    type: string
    default: ""

workflows:
  # Weekly scheduled build: every Sunday at midnight UTC.
  # Also runs on manual CircleCI pipeline triggers and via the GitHub Actions bridge.
  build-docker-images:
    triggers:
      - schedule:
          cron: "0 0 * * 0"
          filters:
            branches:
              only: main
    jobs:
      - build-flang-image:
          context:
            - docker-hub-creds
      - build-openmpi-image:
          context:
            - docker-hub-creds
          requires:
            - build-flang-image

  # Manual trigger via GitHub Actions workflow_dispatch bridge.
  build-docker-images-manual:
    when: << pipeline.parameters.GHA_Action >>
    jobs:
      - build-flang-image:
          context:
            - docker-hub-creds
      - build-openmpi-image:
          context:
            - docker-hub-creds
          requires:
            - build-flang-image

jobs:
  build-flang-image:
    docker:
      - image: cimg/base:current
    resource_class: xlarge
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Login to Docker Hub
          command: |
            echo $DOCKERHUB_AUTH_TOKEN | docker login --username $DOCKERHUB_USER --password-stdin
      - run:
          name: Build Flang image
          command: |
            docker build --no-cache --progress=plain \
              -f Dockerfile.flang \
              --build-arg llvmversion=22 \
              -t gmao/llvm-flang:22 \
              -t gmao/llvm-flang:latest \
              . 2>&1 | tee build.flang.log
      - run:
          name: Push Flang image to Docker Hub
          command: |
            docker push gmao/llvm-flang:22
            docker push gmao/llvm-flang:latest

  build-openmpi-image:
    docker:
      - image: cimg/base:current
    resource_class: xlarge
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Login to Docker Hub
          command: |
            echo $DOCKERHUB_AUTH_TOKEN | docker login --username $DOCKERHUB_USER --password-stdin
      - run:
          name: Build OpenMPI image
          command: |
            docker build --no-cache --progress=plain \
              -f Dockerfile.openmpi \
              --build-arg mpiversion=5.0.10 \
              -t gmao/llvm-flang-openmpi:22 \
              -t gmao/llvm-flang-openmpi:latest \
              . 2>&1 | tee build.openmpi.log
      - run:
          name: Push OpenMPI image to Docker Hub
          command: |
            docker push gmao/llvm-flang-openmpi:22
            docker push gmao/llvm-flang-openmpi:latest
